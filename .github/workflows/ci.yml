name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests -v

      - name: Lint templates (dogfood)
        run: |
          for f in templates/*.py; do
            python scripts/strategy_lint.py "$f" || exit 1
          done

      - name: Lint examples (dogfood)
        run: |
          for f in examples/case-*/strategy.py examples/case-*/sample_strategy.py; do
            [ -f "$f" ] || continue
            python scripts/strategy_lint.py "$f" || exit 1
          done

      - name: Smoke-test research_importer CLI
        run: |
          python -m research_importer codegen \
            examples/case-research-replication/sample_extracted.json \
            -o /tmp/jqskill_ci_strategy
          python scripts/strategy_lint.py /tmp/jqskill_ci_strategy/strategy.py
