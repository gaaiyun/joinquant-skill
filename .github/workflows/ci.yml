name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # v2 新增的 factors/ factor_lab/ 需要 numpy + pandas
          pip install pytest numpy pandas

      - name: Run pytest
        run: python -m pytest tests -v

      - name: Lint templates (dogfood)
        run: |
          for f in templates/*.py; do
            python scripts/strategy_lint.py "$f" || exit 1
          done

      - name: Lint examples/case-*/strategy.py (dogfood)
        run: |
          for f in examples/case-*/strategy.py; do
            python scripts/strategy_lint.py "$f" || exit 1
          done
